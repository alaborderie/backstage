name: Image
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ghcr.io/alaborderie/backstage:${{ github.sha }}
            ghcr.io/alaborderie/backstage:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: bash scripts/verify-image.sh ghcr.io/alaborderie/backstage:${{ github.sha }}
      - run: |
          docker push ghcr.io/alaborderie/backstage:${{ github.sha }}
          docker push ghcr.io/alaborderie/backstage:latest
