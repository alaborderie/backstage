app:
  title: Antoine's Backstage
  baseUrl: http://localhost:3000
  packages: all
  extensions:
    - theme:app/light: false
    - theme:app/dark: false
    - page:home:
        config:
          path: /
          defaultConfig:
            - component: GithubOpenIssues
              column: 0
              row: 0
              width: 7
              height: 12
            - component: GithubPullRequests
              column: 7
              row: 0
              width: 5
              height: 6
            - component: home-page-widget:cloud-agents/cloud-agents
              column: 7
              row: 6
              width: 5
              height: 6
    - home-page-widget:home/github-issues:
        config:
          owner: alaborderie
          hiddenLabels: [on-hold]
organization:
  name: Antoine Laborderie
backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'
integrations:
  github:
    - host: github.com
techdocs:
  builder: external
  publisher:
    type: local
auth:
  environment: development
  providers:
    github:
      development:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
catalog:
  rules:
    - allow: [Component, System, API, Resource, Location]
  locations:
    - type: file
      target: ../../catalog/org.yaml
      rules:
        - allow: [User]
permission:
  enabled: true
