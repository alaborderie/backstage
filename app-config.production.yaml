app:
  baseUrl: https://backstage.antoinelaborderie.com
backend:
  baseUrl: https://backstage.antoinelaborderie.com
  listen: ':7007'
  cors:
    origin: https://backstage.antoinelaborderie.com
  auth:
    keys:
      - secret: ${BACKEND_SECRET}
    externalAccess:
      - type: cloud-agents-hub-run
        options: {}
        accessRestrictions:
          - plugin: cloud-agents
  actions:
    pluginSources:
      - cloud-agents
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_ID}
          privateKey: ${GITHUB_APP_PRIVATE_KEY}
          clientId: ${AUTH_GITHUB_CLIENT_ID}
          clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: k3s
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
auth:
  environment: production
  providers:
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
catalog:
  locations:
    - type: file
      target: ./catalog/org.yaml
      rules:
        - allow: [User, Group]

cloudAgents:
  namespace: ${CLOUD_AGENTS_NAMESPACE}
  runnerImage: ${CLOUD_AGENTS_RUNNER_IMAGE}
  runnerBackendUrl: ${CLOUD_AGENTS_RUNNER_BACKEND_URL}
  encryptionKey: ${CLOUD_AGENTS_ENCRYPTION_KEY}
  github:
    clientId: ${AUTH_GITHUB_CLIENT_ID}
    clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
